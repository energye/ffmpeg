name: debug-mini-single

# 双版本单目标调试入口：只在 Actions 上调，不在本地调。
# 打标签触发，一次只编一个目标的一个版本，尾巴数字是重试计数，每调一次加一：
#   debug-mini-linux-x64-base-001 / debug-mini-linux-x64-full-001
#   linux-arm64 / linux-386 / linux-arm 同理（各分 base/full）
#   debug-mini-win-x64-base-001 / debug-mini-win-arm64-full-001
#   debug-mini-darwin-x64-base-001 / debug-mini-darwin-arm64-full-001
# 同名标签推不上去，所以重试必须加尾巴数字。
# 构建脚本在 dual/（两档配方 + 双版本构建，一次搬运后本仓自带），
# 发版流程（build-mini.yml + mini/）不动，调通后再合回去统一发版。
# 日志直接在这次运行里看。

on:
  push:
    tags:
      - 'debug-mini-*'

jobs:
  linux-win-single:
    if: startsWith(github.ref_name, 'debug-mini-linux-') || startsWith(github.ref_name, 'debug-mini-win-')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Parse target+variant from tag
        run: |
          REF="${GITHUB_REF_NAME}"
          BASE="${REF#debug-mini-}"
          PAIR="$(echo "$BASE" | sed -E 's/-[0-9]+$//')"
          VARIANT="$(echo "$PAIR" | sed -E 's/.*-(base|full)$/\1/')"
          TARGET="$(echo "$PAIR" | sed -E 's/-(base|full)$//')"
          echo "tag=$REF target=$TARGET variant=$VARIANT"
          case "$TARGET" in
            linux-x64|linux-arm64|linux-386|linux-arm|win-x64|win-arm64) ;;
            *) echo "unknown target $TARGET" >&2; exit 2 ;;
          esac
          case "$VARIANT" in
            base|full) ;;
            *) echo "unknown variant $VARIANT (want base|full)" >&2; exit 2 ;;
          esac
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "VARIANT=$VARIANT" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: 取配方（dual/recipe，两档真源）
        run: |
          cd dual && go run ./recipe -variant "$VARIANT" > "/tmp/recipe-$VARIANT.flags"
          head -c 300 "/tmp/recipe-$VARIANT.flags"; echo

      - name: 备外库料（下源码包+验包，base 只用其中 openssl+zlib）
        run: |
          docker build -f dual/Dockerfile -t ffbuild-dual .
          docker run --rm \
            -v /tmp/deps:/tmp/deps \
            -e FREETYPE_VER=2.13.2 -e HARFBUZZ_VER=8.3.0 -e FRIBIDI_VER=1.0.13 \
            -e FONTCONFIG_VER=2.15.0 -e LIBASS_VER=0.17.1 -e OPENH264_VER=2.4.1 \
            -e OPENSSL_VER=3.0.16 -e ZLIB_VER=1.3.1 -e EXPAT_VER=2.6.4 \
            ffbuild-dual bash -c 'cd /tmp/deps && /build-deps.sh need-only; ls -la /tmp/deps/'
          ls -la /tmp/deps/

      - name: 编外库静态 .a（对号入座，base 只用其中 ossl+zlib）
        run: |
          case "$TARGET" in
            linux-x64) DEPARCH=x64 ;; linux-arm64) DEPARCH=arm64 ;;
            linux-386) DEPARCH=386 ;; linux-arm) DEPARCH=arm ;;
            win-x64) DEPARCH=w64 ;; win-arm64) DEPARCH=w64arm ;;
          esac
          docker run --rm \
            -v /tmp/deps:/tmp/deps \
            -v /tmp/depopt:/opt \
            -e FREETYPE_VER=2.13.2 -e HARFBUZZ_VER=8.3.0 -e FRIBIDI_VER=1.0.13 \
            -e FONTCONFIG_VER=2.15.0 -e LIBASS_VER=0.17.1 -e OPENH264_VER=2.4.1 \
            -e OPENSSL_VER=3.0.16 -e ZLIB_VER=1.3.1 -e EXPAT_VER=2.6.4 \
            ffbuild-dual /build-deps.sh $DEPARCH

      - name: 编单文件
        run: |
          mkdir -p out /tmp/deps /tmp/depopt
          docker build -f dual/Dockerfile -t ffbuild-dual .
          docker run --rm \
            -v "$PWD:/src" \
            -v "/tmp/recipe-$VARIANT.flags:/tmp/recipe-$VARIANT.flags" \
            -v /tmp/deps:/tmp/deps \
            -v /tmp/depopt:/opt \
            -v "$PWD/out:/out" \
            ffbuild-dual /build-one.sh "$TARGET" "$VARIANT"

      - name: 校验落盘
        run: |
          case "$VARIANT" in
            full) pat="*full*" ;;
            *) pat="libgpui_ffmpeg.so libgpui_ffmpeg.dll" ;;
          esac
          f=""
          for p in $pat; do
            f=$(find "out/$TARGET" -name "$p" | head -1)
            test -n "$f" && break
          done
          test -n "$f" || { echo "FAIL: 产物没落盘"; exit 1; }
          ls -la "$f"

      - name: 许可门禁（禁 GPL/nonfree 字样）
        run: |
          f=$(find "out/$TARGET" -type f | head -1)
          echo "checking $f"
          if strings "$f" | grep -iE "libx264|libx265|libfdk_aac" | head -3; then
            echo "GPL/nonfree 库混入，拒绝入库"; exit 1
          fi
          strings "$f" | grep -i "LGPL version 2.1" | head -2

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name }}
          path: out/*

  mac-single:
    if: startsWith(github.ref_name, 'debug-mini-darwin-')
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.13"
    steps:
      - uses: actions/checkout@v4

      - name: Parse target+variant from tag
        run: |
          REF="${GITHUB_REF_NAME}"
          BASE="${REF#debug-mini-}"
          PAIR="$(echo "$BASE" | sed -E 's/-[0-9]+$//')"
          VARIANT="$(echo "$PAIR" | sed -E 's/.*-(base|full)$/\1/')"
          TARGET="$(echo "$PAIR" | sed -E 's/-(base|full)$//')"
          echo "tag=$REF target=$TARGET variant=$VARIANT"
          case "$TARGET" in
            darwin-x64) echo "ARCH=x64" >> "$GITHUB_ENV" ;;
            darwin-arm64) echo "ARCH=arm64" >> "$GITHUB_ENV" ;;
            *) echo "unknown target $TARGET" >&2; exit 2 ;;
          esac
          case "$VARIANT" in
            base|full) ;;
            *) echo "unknown variant $VARIANT (want base|full)" >&2; exit 2 ;;
          esac
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "VARIANT=$VARIANT" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: 装工具链（含 full 烧字件）
        run: brew install nasm pkg-config freetype harfbuzz fontconfig fribidi libass openh264 || true

      - name: 取配方并编单文件
        run: |
          cd dual && go run ./recipe -variant "$VARIANT" > /tmp/recipe.flags
          cd "$GITHUB_WORKSPACE"
          SRC="$PWD" OUTDIR="$PWD/out" sh dual/build-one-mac.sh "$ARCH" "$VARIANT"

      - name: 校验落盘
        run: |
          case "$VARIANT" in
            full) pat="*full*.dylib" ;; *) pat="libgpui_ffmpeg.dylib" ;;
          esac
          f=$(find "out/$TARGET" -maxdepth 1 -name "$pat" | head -1)
          test -n "$f" || { echo "FAIL: 产物没落盘"; exit 1; }
          ls -la "$f"

      - name: 许可门禁（禁 GPL/nonfree 字样）
        run: |
          f=$(find "out/$TARGET" -maxdepth 1 -type f | head -1)
          echo "checking $f"
          if strings "$f" | grep -iE "libx264|libx265|libfdk_aac" | head -3; then
            echo "GPL/nonfree 库混入，拒绝入库"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name }}
          path: out/*
