name: debug-win

# Windows 单目标调试入口：在 ubuntu-22.04 的容器里用 mingw/llvm-mingw
# 交叉编（Windows 本机编更麻烦且未经验证，交叉产物经多方验证可用），
# 只在 Actions 上调，不在本地调。
# 打标签触发，一次只编一个目标的一个版本，尾巴数字是重试计数：
#   debug-mini-win-x64-base-001 / debug-mini-win-x64-full-001
#   debug-mini-win-arm64-base-001 / debug-mini-win-arm64-full-001
# 同名标签推不上去，重试必须把尾巴数字加一。
# 开关：调 win 时启用本文件，调别的平台时用
#   gh workflow disable debug-win.yml 把本文件停掉（反之启用）。
# 调通后合入 build-mini.yml 统一发版（本文件的步骤与发版流 linux-win
# 侧同源，合入时直接搬）。

on:
  push:
    tags:
      - 'debug-mini-win-*'

jobs:
  win-single:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Parse target+variant from tag
        run: |
          REF="${GITHUB_REF_NAME}"
          BASE="${REF#debug-mini-}"
          PAIR="$(echo "$BASE" | sed -E 's/-[0-9]+$//')"
          VARIANT="$(echo "$PAIR" | sed -E 's/.*-(base|full)$/\1/')"
          TARGET="$(echo "$PAIR" | sed -E 's/-(base|full)$//')"
          echo "tag=$REF target=$TARGET variant=$VARIANT"
          case "$TARGET" in
            win-x64|win-arm64) ;;
            *) echo "unknown target $TARGET" >&2; exit 2 ;;
          esac
          case "$VARIANT" in
            base|full) ;;
            *) echo "unknown variant $VARIANT (want base|full)" >&2; exit 2 ;;
          esac
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "VARIANT=$VARIANT" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: 取配方（dual/recipe，两档真源）
        run: |
          cd dual && go run ./recipe -variant "$VARIANT" > "/tmp/recipe-$VARIANT.flags"
          head -c 300 "/tmp/recipe-$VARIANT.flags"; echo

      - name: 备外库料（下源码包+验包，base 只用其中 zlib）
        run: |
          docker build -f dual/Dockerfile -t ffbuild-dual .
          docker run --rm \
            -v /tmp/deps:/tmp/deps \
            -e FREETYPE_VER=2.13.2 -e HARFBUZZ_VER=8.3.0 -e FRIBIDI_VER=1.0.13 \
            -e FONTCONFIG_VER=2.15.0 -e LIBASS_VER=0.17.1 -e OPENH264_VER=2.4.1 \
            -e OPENSSL_VER=3.0.16 -e ZLIB_VER=1.3.1 -e EXPAT_VER=2.6.4 \
            ffbuild-dual bash -c 'cd /tmp/deps && /build-deps.sh need-only && ls -la /tmp/deps/'
          ls -la /tmp/deps/

      - name: 编外库静态 .a（对号入座，base 只用其中 zlib）
        run: |
          case "$TARGET" in
            win-x64) DEPARCH=w64 ;; win-arm64) DEPARCH=w64arm ;;
          esac
          docker run --rm \
            -v /tmp/deps:/tmp/deps \
            -v /tmp/depopt:/opt \
            -e FREETYPE_VER=2.13.2 -e HARFBUZZ_VER=8.3.0 -e FRIBIDI_VER=1.0.13 \
            -e FONTCONFIG_VER=2.15.0 -e LIBASS_VER=0.17.1 -e OPENH264_VER=2.4.1 \
            -e OPENSSL_VER=3.0.16 -e ZLIB_VER=1.3.1 -e EXPAT_VER=2.6.4 \
            ffbuild-dual /build-deps.sh $DEPARCH

      - name: 编单文件
        run: |
          mkdir -p out /tmp/deps /tmp/depopt
          docker build -f dual/Dockerfile -t ffbuild-dual .
          docker run --rm \
            -v "$PWD:/src" \
            -v "/tmp/recipe-$VARIANT.flags:/tmp/recipe-$VARIANT.flags" \
            -v /tmp/deps:/tmp/deps \
            -v /tmp/depopt:/opt \
            -v "$PWD/out:/out" \
            ffbuild-dual /build-one.sh "$TARGET" "$VARIANT"

      - name: 校验落盘
        run: |
          case "$VARIANT" in
            full) pat="*full*.dll" ;; *) pat="libgpui_ffmpeg.dll" ;;
          esac
          f=$(find "out/$TARGET" -maxdepth 1 -name "$pat" | head -1)
          test -n "$f" || { echo "FAIL: 产物没落盘"; exit 1; }
          ls -la "$f"

      - name: 许可门禁（禁 GPL/nonfree 字样）
        run: |
          f=$(find "out/$TARGET" -maxdepth 1 -type f | head -1)
          echo "checking $f"
          echo "--- matched GPL/nonfree strings (empty means clean) ---"
          strings "$f" | grep -iE "libx264|libx265|libfdk_aac" | sort -u | head -20 || true
          echo "--- end of matches ---"
          if strings "$f" | grep -iqE "libx264|libx265|libfdk_aac"; then
            echo "GPL/nonfree 库混入，拒绝入库"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name }}
          path: out/*
