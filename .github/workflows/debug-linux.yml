name: debug-linux

# Linux 单目标调试入口：只在 Actions 上调，不在本地调。
# 打标签触发，一次只编一个目标的一个版本，尾巴数字是重试计数：
#   debug-mini-linux-x64-base-001 / debug-mini-linux-x64-full-001
#   linux-arm64 / linux-386 / linux-arm 同理（各分 base/full）
# 同名标签推不上去，重试必须把尾巴数字加一。
# 开关：调 linux 时启用本文件，调别的平台时在仓库 Settings 或用
#   gh workflow disable debug-linux.yml 把本文件停掉（反之启用）。
# 调通后合入 release.yml 统一发版（本文件的步骤与发版流 linux-win
# 侧同源，合入时直接搬）。

on:
  push:
    tags:
      - 'debug-mini-linux-*'

jobs:
  linux-single:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Parse target+variant from tag
        run: |
          REF="${GITHUB_REF_NAME}"
          BASE="${REF#debug-mini-}"
          PAIR="$(echo "$BASE" | sed -E 's/-[0-9]+$//')"
          VARIANT="$(echo "$PAIR" | sed -E 's/.*-(base|full)$/\1/')"
          TARGET="$(echo "$PAIR" | sed -E 's/-(base|full)$//')"
          echo "tag=$REF target=$TARGET variant=$VARIANT"
          case "$TARGET" in
            linux-x64|linux-arm64|linux-386|linux-arm) ;;
            *) echo "unknown target $TARGET" >&2; exit 2 ;;
          esac
          case "$VARIANT" in
            base|full) ;;
            *) echo "unknown variant $VARIANT (want base|full)" >&2; exit 2 ;;
          esac
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "VARIANT=$VARIANT" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: 取配方（dual/recipe，两档真源）
        run: |
          cd dual && go run ./recipe -variant "$VARIANT" > "/tmp/recipe-$VARIANT.flags"
          head -c 300 "/tmp/recipe-$VARIANT.flags"; echo

      - name: 备外库料（本仓 third_party 预置包，容器内拷贝+验包，base 只用其中 openssl+zlib）
        run: |
          docker build -f dual/Dockerfile -t ffbuild-dual .
          docker run --rm \
            -v "$PWD:/src" \
            -v /tmp/deps:/tmp/deps \
            -e FREETYPE_VER=2.14.3 -e HARFBUZZ_VER=14.5.0 -e FRIBIDI_VER=1.0.17 \
            -e FONTCONFIG_VER=2.18.3 -e LIBASS_VER=0.17.5 -e OPENH264_VER=2.6.0 \
            -e OPENSSL_VER=3.5.8 -e ZLIB_VER=1.3.2 -e EXPAT_VER=2.8.5 \
            ffbuild-dual bash -c 'cd /tmp/deps && /build-deps.sh need-only && ls -la /tmp/deps/'
          ls -la /tmp/deps/

      - name: 编外库静态 .a（对号入座，base 只用其中 ossl+zlib）
        run: |
          case "$TARGET" in
            linux-x64) DEPARCH=x64 ;; linux-arm64) DEPARCH=arm64 ;;
            linux-386) DEPARCH=386 ;; linux-arm) DEPARCH=arm ;;
          esac
          docker run --rm \
            -v "$PWD:/src" \
            -v /tmp/deps:/tmp/deps \
            -v /tmp/depopt:/opt \
            -e FREETYPE_VER=2.14.3 -e HARFBUZZ_VER=14.5.0 -e FRIBIDI_VER=1.0.17 \
            -e FONTCONFIG_VER=2.18.3 -e LIBASS_VER=0.17.5 -e OPENH264_VER=2.6.0 \
            -e OPENSSL_VER=3.5.8 -e ZLIB_VER=1.3.2 -e EXPAT_VER=2.8.5 \
            ffbuild-dual /build-deps.sh $DEPARCH

      - name: 编单文件
        run: |
          mkdir -p out /tmp/deps /tmp/depopt
          docker build -f dual/Dockerfile -t ffbuild-dual .
          docker run --rm \
            -v "$PWD:/src" \
            -v "/tmp/recipe-$VARIANT.flags:/tmp/recipe-$VARIANT.flags" \
            -v /tmp/deps:/tmp/deps \
            -v /tmp/depopt:/opt \
            -v "$PWD/out:/out" \
            ffbuild-dual /build-one.sh "$TARGET" "$VARIANT"

      - name: 校验落盘
        run: |
          case "$VARIANT" in
            full) pat="*full*" ;;
            *) pat="libgpui_ffmpeg.so" ;;
          esac
          f=""
          for p in $pat; do
            f=$(find "out/$TARGET" -name "$p" | head -1)
            test -n "$f" && break
          done
          test -n "$f" || { echo "FAIL: 产物没落盘"; exit 1; }
          ls -la "$f"

      - name: 许可门禁（禁 GPL/nonfree 字样）
        run: |
          f=$(find "out/$TARGET" -type f | head -1)
          echo "checking $f"
          echo "--- matched GPL/nonfree strings (empty means clean) ---"
          strings "$f" | grep -iE "libx264|libx265|libfdk_aac" | sort -u | head -20 || true
          echo "--- end of matches ---"
          if strings "$f" | grep -iqE "libx264|libx265|libfdk_aac"; then
            echo "GPL/nonfree 库混入，拒绝入库"; exit 1
          fi
          strings "$f" | grep -i "LGPL version 2.1" | head -2

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name }}
          path: out/*
