name: mini-decode-lib

# 发版时一次编出全平台解码单文件（gpui video用）。
# 功能清单见 mini/build-one.sh：视频/音频/图片/字幕解码约30种，
# 分流约20种（+DASH只在x64 Linux），本地+网络协议，画面/音频滤镜
# （构图/帧管理/调色/老片修复/防抖/音量混音），截图编码，硬解按平台
# 开（x64 Linux vaapi，Windows d3d11va，mac videotoolbox），
# 许可保持LGPL宽松。N卡nvdec后续备好头文件再加。
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  linux-win:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Fetch openssl+zlib sources (static link, 不欠动态账)
        run: |
          curl -sSL -o mini/openssl-3.0.16.tar.gz \
            "https://www.openssl.org/source/openssl-3.0.16.tar.gz"
          curl -sSL -o mini/zlib-1.3.1.tar.gz \
            "https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz"
          ls -la mini/openssl-3.0.16.tar.gz mini/zlib-1.3.1.tar.gz

      - name: Build toolchain images (ubuntu18, 老glibc兼容)
        run: |
          docker build -f mini/Dockerfile -t ffbuild-mini .
          docker build -f mini/Dockerfile-32 -t ffbuild-mini-32 .
          docker build -f mini/Dockerfile-arm -t ffbuild-mini-arm .
          docker build -f mini/Dockerfile-arm64 -t ffbuild-mini-arm64 .

      - name: Build linux + win-x64 targets
        run: |
          mkdir -p out
          docker run --rm -v "$PWD:/src" -v "$PWD/out:/out" ffbuild-mini /build-one.sh linux-x64
          docker run --rm -v "$PWD:/src" -v "$PWD/out:/out" ffbuild-mini-arm64 /build-one.sh linux-arm64
          docker run --rm -v "$PWD:/src" -v "$PWD/out:/out" ffbuild-mini /build-one.sh win-x64
          docker run --rm -v "$PWD:/src" -v "$PWD/out:/out" ffbuild-mini-32 /build-one.sh linux-386
          docker run --rm -v "$PWD:/src" -v "$PWD/out:/out" ffbuild-mini-arm /build-one.sh linux-arm
          for t in linux-x64 linux-arm64 win-x64 linux-386 linux-arm; do
            test -f "out/$t/libgpui_ffmpeg.$(case $t in win-*) echo dll;; *) echo so;; esac)" \
              || { echo "missing $t"; exit 1; }
          done
          ls -la out/*/libgpui_ffmpeg.*

      - name: Build win-arm64 (llvm-mingw)
        run: |
          curl -sSL -o /tmp/llvm-mingw.tar.xz \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20231003/llvm-mingw-20231003-msvcrt-ubuntu-20.04-x86_64.tar.xz"
          mkdir -p /tmp/llvm-mingw && tar -xf /tmp/llvm-mingw.tar.xz -C /tmp/llvm-mingw --strip-components=1
          curl -sSL -o /tmp/zlib.tgz \
            "https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz"
          mkdir -p /tmp/zwinarm && tar -xzf /tmp/zlib.tgz -C /tmp/zwinarm
          cd /tmp/zwinarm/zlib-1.3.1
          export PATH=/tmp/llvm-mingw/bin:$PATH
          CROSS_PREFIX=aarch64-w64-mingw32- CC=aarch64-w64-mingw32-gcc AR=aarch64-w64-mingw32-ar RANLIB=aarch64-w64-mingw32-ranlib CFLAGS="-fPIC -O2" ./configure --static --prefix=/tmp/zlib-w64arm
          make
          make install
          cd "$GITHUB_WORKSPACE"
          LLVM_MINGW=/tmp/llvm-mingw ZLIB_WINARM64=/tmp/zlib-w64arm SRC="$PWD" OUTDIR="$PWD/out" sh mini/build-win-arm64.sh
          test -f out/win-arm64/libgpui_ffmpeg.dll || { echo "missing win-arm64"; exit 1; }

      - name: Rename for release assets
        run: |
          mkdir -p dist
          cp out/linux-x64/libgpui_ffmpeg.so dist/libgpui_ffmpeg-linux-x64.so
          cp out/linux-arm64/libgpui_ffmpeg.so dist/libgpui_ffmpeg-linux-arm64.so
          cp out/linux-386/libgpui_ffmpeg.so dist/libgpui_ffmpeg-linux-386.so
          cp out/linux-arm/libgpui_ffmpeg.so dist/libgpui_ffmpeg-linux-arm.so
          cp out/win-x64/libgpui_ffmpeg.dll dist/libgpui_ffmpeg-win-x64.dll
          cp out/win-arm64/libgpui_ffmpeg.dll dist/libgpui_ffmpeg-win-arm64.dll
          ls -la dist/

      - uses: actions/upload-artifact@v7
        with:
          name: mini-linux-win
          path: dist/*

  mac:
    # 照 rwgpu cd.yml：矩阵式起两个任务，一个编 x86_64，一个编 aarch64，
    # 各出各的包，不在一台机器上硬交叉（M 机器编 Intel 包走 clang -arch，
    # 脚本里最后用 lipo -info 验明正身）。
    name: mini - ${{ matrix.name }}
    runs-on: macos-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: darwin-x64
            target: x86_64-apple-darwin
            arch: x86_64
            tag: darwin-x64
            archive-name: mini-darwin-x64
          - name: darwin-aarch64
            target: aarch64-apple-darwin
            arch: aarch64
            tag: darwin-arm64
            archive-name: mini-darwin-aarch64
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.13"
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: brew install nasm pkg-config

      - name: Build darwin ${{ matrix.arch }}
        run: |
          mkdir -p out
          SRC="$PWD" OUTDIR="$PWD/out" sh mini/build-mac.sh ${{ matrix.arch }} ${{ matrix.tag }}
          test -f "out/${{ matrix.tag }}/libgpui_ffmpeg.dylib" || { echo "missing ${{ matrix.tag }}"; exit 1; }
          mkdir -p dist
          cp "out/${{ matrix.tag }}/libgpui_ffmpeg.dylib" "dist/libgpui_ffmpeg-${{ matrix.tag }}.dylib"
          ls -la dist/

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive-name }}
          path: dist/*

  mac-universal:
    # 二合一通用包：把上面两个单架构包合成一个（本地脚本默认也这么干）。
    name: mini - darwin-universal
    needs: [mac]
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: mini-darwin-x64
          path: single/x64
      - uses: actions/download-artifact@v8
        with:
          name: mini-darwin-aarch64
          path: single/arm64
      - name: Merge universal
        run: |
          mkdir -p dist
          lipo -create single/x64/libgpui_ffmpeg-darwin-x64.dylib single/arm64/libgpui_ffmpeg-darwin-arm64.dylib \
            -output dist/libgpui_ffmpeg-darwin-universal.dylib
          lipo -info dist/libgpui_ffmpeg-darwin-universal.dylib
          ls -la dist/

      - uses: actions/upload-artifact@v7
        with:
          name: mini-darwin-universal
          path: dist/*

  publish:
    needs: [linux-win, mac, mac-universal]
    if: github.event_name == 'release'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create commit-sha file
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          echo $GITHUB_SHA > dist/commit-sha
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
          body: |
            gpui 最小解码单文件（7.1 同一棵树，许可 LGPL 宽松）。
            Linux 在 ubuntu18 容器里编（老系统兼容）；mac 最低支持 10.13；
            Windows 用交叉编译（x64）与 llvm-mingw（arm64）。
