name: gpui-ffmpeg-release

# 唯一构建入口：一次编出 8 架构 × 2 版本 = 16 个单文件 + darwin 通用包
# （base/full 各一），随 release 自动上传。调试流（debug-mini.yml）已删除。
#
# 平台分工（照 rwgpu cd.yml 按系统分组）：
#   linux-* 与 win-*（mingw / llvm-mingw 交叉）在 ubuntu-22.04 的
#   ubuntu18 兼容容器里编（老 glibc 兼容）；
#   darwin-* 在 macos 原生编（x64 在 arm64 机器上交叉，静态链见
#   dual/build-deps-mac.sh）。
# 配方唯一真源：dual/recipe（Go 命令），两档都不碰 GPL（x264/x265/fdk
# 一个不开），许可保持 LGPL 2.1。

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  FREETYPE_VER: 2.13.2
  HARFBUZZ_VER: 8.3.0
  FRIBIDI_VER: 1.0.13
  FONTCONFIG_VER: 2.15.0
  LIBASS_VER: 0.17.1
  OPENH264_VER: 2.4.1
  OPENSSL_VER: 3.0.16
  ZLIB_VER: 1.3.1
  EXPAT_VER: 2.6.4

jobs:
  linux-win:
    name: ${{ matrix.name }} (base+full)
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-x64, deparch: x64, ext: so}
          - {name: linux-arm64, deparch: arm64, ext: so}
          - {name: linux-386, deparch: 386, ext: so}
          - {name: linux-arm, deparch: arm, ext: so}
          - {name: win-x64, deparch: w64, ext: dll}
          - {name: win-arm64, deparch: w64arm, ext: dll}
    env:
      TARGET: ${{ matrix.name }}
      DEPARCH: ${{ matrix.deparch }}
      LIBEXT: ${{ matrix.ext }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build toolchain image (ubuntu18, 老glibc兼容)
        run: docker build -f dual/Dockerfile -t ffbuild-dual .

      - name: 备外库料（本仓 third_party 预置包，容器内拷贝+验包）
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -v /tmp/deps:/tmp/deps \
            -e FREETYPE_VER -e HARFBUZZ_VER -e FRIBIDI_VER \
            -e FONTCONFIG_VER -e LIBASS_VER -e OPENH264_VER \
            -e OPENSSL_VER -e ZLIB_VER -e EXPAT_VER \
            ffbuild-dual bash -c 'cd /tmp/deps && /build-deps.sh need-only && ls -la /tmp/deps/'
          ls -la /tmp/deps/

      - name: 编外库静态 .a（base 只用其中 openssl+zlib）
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -v /tmp/deps:/tmp/deps \
            -v /tmp/depopt:/opt \
            -e FREETYPE_VER -e HARFBUZZ_VER -e FRIBIDI_VER \
            -e FONTCONFIG_VER -e LIBASS_VER -e OPENH264_VER \
            -e OPENSSL_VER -e ZLIB_VER -e EXPAT_VER \
            ffbuild-dual /build-deps.sh "$DEPARCH"

      - name: 取配方（dual/recipe，两档真源）
        run: |
          cd dual && go run ./recipe -variant base > "/tmp/recipe-base.flags"
          go run ./recipe -variant full > "/tmp/recipe-full.flags"
          head -c 200 "/tmp/recipe-base.flags"; echo

      - name: 编单文件（base+full）
        run: |
          mkdir -p out /tmp/deps /tmp/depopt
          docker run --rm \
            -v "$PWD:/src" \
            -v /tmp/recipe-base.flags:/tmp/recipe-base.flags \
            -v /tmp/recipe-full.flags:/tmp/recipe-full.flags \
            -v /tmp/deps:/tmp/deps \
            -v /tmp/depopt:/opt \
            -v "$PWD/out:/out" \
            ffbuild-dual bash -c '/build-one.sh "$0" base && /build-one.sh "$0" full' "$TARGET"

      - name: 许可门禁（禁 GPL/nonfree 字样）
        run: |
          for f in out/$TARGET/*; do
            echo "checking $f"
            echo "--- matched GPL/nonfree strings (empty means clean) ---"
            strings "$f" | grep -iE "libx264|libx265|libfdk_aac" | sort -u | head -20 || true
            echo "--- end of matches ---"
            if strings "$f" | grep -iqE "libx264|libx265|libfdk_aac"; then
              echo "GPL/nonfree 库混入，拒绝入库"; exit 1
            fi
          done
          strings out/$TARGET/* 2>/dev/null | grep -i "LGPL version 2.1" | head -2

      - name: Rename for release assets
        run: |
          mkdir -p dist
          cp "out/$TARGET/libgpui_ffmpeg.$LIBEXT" "dist/libgpui_ffmpeg-$TARGET.$LIBEXT"
          cp "out/$TARGET/libgpui_ffmpeg_full.$LIBEXT" "dist/libgpui_ffmpeg_full-$TARGET.$LIBEXT"
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: rel-${{ matrix.name }}
          path: dist/*

  mac:
    name: ${{ matrix.tag }} (base+full)
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {tag: darwin-x64, arch: x64}
          - {tag: darwin-arm64, arch: arm64}
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.13"
      TARGET: ${{ matrix.tag }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: 装工具链（含 full 烧字件）
        run: brew install nasm pkg-config meson ninja gperf freetype harfbuzz fontconfig fribidi libass openh264 || true

      - name: 编 mac 外库静态 .a（仅 x64：brew 无 x86_64 瓶，源码编静态链）
        if: matrix.arch == 'x64'
        run: sh dual/build-deps-mac.sh x64

      - name: 取配方并编单文件（base+full）
        run: |
          cd dual && go run ./recipe -variant base > /tmp/recipe.flags
          cd "$GITHUB_WORKSPACE"
          SRC="$PWD" OUTDIR="$PWD/out" sh dual/build-one-mac.sh "$ARCH" base
          cd dual && go run ./recipe -variant full > /tmp/recipe.flags
          cd "$GITHUB_WORKSPACE"
          SRC="$PWD" OUTDIR="$PWD/out" sh dual/build-one-mac.sh "$ARCH" full

      - name: 许可门禁（禁 GPL/nonfree 字样）
        run: |
          for f in out/$TARGET/*.dylib; do
            echo "checking $f"
            echo "--- matched GPL/nonfree strings (empty means clean) ---"
            strings "$f" | grep -iE "libx264|libx265|libfdk_aac" | sort -u | head -20 || true
            echo "--- end of matches ---"
            if strings "$f" | grep -iqE "libx264|libx265|libfdk_aac"; then
              echo "GPL/nonfree 库混入，拒绝入库"; exit 1
            fi
          done

      - name: Rename for release assets
        run: |
          mkdir -p dist
          cp "out/$TARGET/libgpui_ffmpeg.dylib" "dist/libgpui_ffmpeg-$TARGET.dylib"
          cp "out/$TARGET/libgpui_ffmpeg_full.dylib" "dist/libgpui_ffmpeg_full-$TARGET.dylib"
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: rel-${{ matrix.tag }}
          path: dist/*

  mac-universal:
    # 二合一通用包（base/full 各一）：把上面两个单架构包合成一个。
    name: darwin-universal (base+full)
    needs: [mac]
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rel-darwin-x64
          path: single/x64
      - uses: actions/download-artifact@v4
        with:
          name: rel-darwin-arm64
          path: single/arm64
      - name: Merge universal
        run: |
          mkdir -p dist
          lipo -create single/x64/libgpui_ffmpeg-darwin-x64.dylib single/arm64/libgpui_ffmpeg-darwin-arm64.dylib \
            -output dist/libgpui_ffmpeg-darwin-universal.dylib
          lipo -create single/x64/libgpui_ffmpeg_full-darwin-x64.dylib single/arm64/libgpui_ffmpeg_full-darwin-arm64.dylib \
            -output dist/libgpui_ffmpeg_full-darwin-universal.dylib
          lipo -info dist/*.dylib
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: rel-darwin-universal
          path: dist/*

  publish:
    needs: [linux-win, mac, mac-universal]
    if: github.event_name == 'release'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create commit-sha file
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          echo $GITHUB_SHA > dist/commit-sha
          ls -la dist/
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
          body: |
            gpui 单文件 FFmpeg（7.1 同一棵树，许可 LGPL 宽松）。
            基础版 libgpui_ffmpeg.* 只管看（解码+分流+滤镜）；
            高级版 libgpui_ffmpeg_full.* 加写文件（复用+原生编码+烧字）。
            Linux 在 ubuntu18 容器里编（老系统兼容）；mac 最低支持 10.13；
            Windows 用 mingw（x64）与 llvm-mingw（arm64）交叉编。
